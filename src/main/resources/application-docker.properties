spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/notes_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:minhasenha}
spring.datasource.driver-class-name=org.postgresql.Driver

