# Dados de Conexão
spring.datasource.url=jdbc:postgresql://localhost:5432/notes_db
spring.datasource.username=postgres
spring.datasource.password=minhasenha
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate e Criação de Tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Ajuda o Hibernate a entender que é Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Aplicação e Servidor
spring.application.name=NotesApp
server.port=0