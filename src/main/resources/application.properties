# Conexão com o banco
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notes_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:minhasenha}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate — validate garante que o schema bate com as entidades
# O Flyway roda antes do Hibernate, então as tabelas já existem quando chegar aqui
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway — sem baseline, deixa ele rodar as migrations normalmente
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Aplicação
spring.application.name=NotesApp
server.port=${SERVER_PORT:8080}

# Upload de arquivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method